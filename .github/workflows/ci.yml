name: CI

on:
  push:
    branches: [main, master, overhaul]
  pull_request:
    branches: [main, master, overhaul]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libudev-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Linux binary
        run: npm run tauri build -- --no-bundle

      - uses: actions/upload-artifact@v4
        with:
          name: nexusdeck-linux-binary-ci
          retention-days: 7
          path: src-tauri/target/release/nexusdeck

  build-flatpak:
    needs: build-linux
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: nexusdeck-linux-binary-ci
          path: flatpak/

      - name: Prepare Flatpak sources
        run: |
          chmod +x flatpak/nexusdeck
          cp src-tauri/icons/32x32.png flatpak/
          cp src-tauri/icons/128x128.png flatpak/
          cp src-tauri/icons/icon.png flatpak/

      - name: Install GNOME 48 runtime
        run: |
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --noninteractive flathub org.gnome.Platform//48 org.gnome.Sdk//48

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: NexusDeck-ci.flatpak
          manifest-path: flatpak/com.nexusdeck.app.yml
          cache-key: flatpak-ci-${{ github.sha }}
          upload-artifact: false

      - uses: actions/upload-artifact@v4
        with:
          name: nexusdeck-flatpak-ci
          retention-days: 7
          path: NexusDeck-ci.flatpak

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri Windows bundles
        run: npm run tauri build -- --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: nexusdeck-windows-ci
          retention-days: 7
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/portable/*.exe

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run controller focus smoke tests
        run: npm run test:e2e

      - name: Run gamepad router and FOMOD preset unit checks
        run: npm run test:router && npm run test:fomod
