name: Build Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend
        run: npm install
        working-directory: nexusdeck
      - name: Build Tauri app
        run: npm run tauri build
        working-directory: nexusdeck
      - uses: actions/upload-artifact@v4
        with:
          name: nexusdeck-windows
          path: |
            nexusdeck/src-tauri/target/release/bundle/nsis/
            nexusdeck/src-tauri/target/release/bundle/portable/
