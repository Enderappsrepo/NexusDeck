name: Pages

on:
  push:
    branches: [main, master, overhaul]
    paths:
      - "docs/**"
      - "companion-web/**"
      - "scripts/build-companion-web.mjs"
      - ".github/workflows/pages.yml"
      - "install/**"
      - "scripts/sync-install-docs.mjs"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync install scripts to docs
        run: node scripts/sync-install-docs.mjs "${{ github.repository }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build companion web app
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run build:companion

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
