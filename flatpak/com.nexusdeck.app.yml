id: com.nexusdeck.app
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: nexusdeck
appstream-compose: false

finish-args:
  # Display
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  # Network (Nexus API, downloads)
  - --share=network
  # GPU + gamepad (gilrs / Steam Input)
  - --device=dri
  - --device=all
  # Home, Steam libraries, and removable storage (SD cards, external drives).
  # Do NOT use :ro here — mod deploy writes into game Data/ and plugins.txt.
  - --filesystem=home
  - --filesystem=~/.steam
  - --filesystem=~/.local/share/Steam
  - --filesystem=/run/media
  - --filesystem=/var/mnt
  - --filesystem=/mnt
  # Keyring + secret portal + notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.impl.portal.Secret
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.Notifications
  # Run host commands (Proton launch of external tools like BodySlide) via flatpak-spawn --host
  - --talk-name=org.freedesktop.Flatpak
  # Tauri single-instance plugin (com.nexusdeck.app → org.com_nexusdeck_app)
  - --talk-name=org.com_nexusdeck_app.SingleInstance
  - --own-name=org.com_nexusdeck_app.SingleInstance

modules:
  - name: sevenzip
    buildsystem: simple
    build-commands:
      - install -Dm755 7zz /app/bin/7z
    sources:
      - type: file
        path: 7zz

  - name: nexusdeck
    buildsystem: simple
    build-commands:
      - install -Dm755 nexusdeck /app/bin/nexusdeck
      - install -Dm644 com.nexusdeck.app.desktop /app/share/applications/com.nexusdeck.app.desktop
      - install -Dm644 com.nexusdeck.app.metainfo.xml /app/share/metainfo/com.nexusdeck.app.metainfo.xml
      - install -Dm644 32x32.png /app/share/icons/hicolor/32x32/apps/com.nexusdeck.app.png
      - install -Dm644 128x128.png /app/share/icons/hicolor/128x128/apps/com.nexusdeck.app.png
      - install -Dm644 icon.png /app/share/icons/hicolor/256x256/apps/com.nexusdeck.app.png
      - mkdir -p /app/share/nexusdeck/decky
      - tar -xzf decky-host.tar.gz -C /app/share/nexusdeck/decky
      - mkdir -p /app/share/nexusdeck/companion-web
      - tar -xzf companion-web.tar.gz -C /app/share/nexusdeck/companion-web
    sources:
      - type: file
        path: nexusdeck
      - type: file
        path: com.nexusdeck.app.desktop
      - type: file
        path: com.nexusdeck.app.metainfo.xml
      - type: file
        path: 32x32.png
      - type: file
        path: 128x128.png
      - type: file
        path: icon.png
      - type: file
        path: decky-host.tar.gz
      - type: file
        path: companion-web.tar.gz
