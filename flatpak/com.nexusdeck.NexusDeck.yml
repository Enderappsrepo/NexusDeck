app-id: com.nexusdeck.NexusDeck
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node20
command: nexusdeck
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  - --filesystem=xdg-documents
  - --talk-name=org.freedesktop.secrets
modules:
  - name: nexusdeck
    buildsystem: simple
    build-commands:
      - npm install
      - npm run tauri build -- --bundles appimage
      - install -Dm755 src-tauri/target/release/nexusdeck /app/bin/nexusdeck
    sources:
      - type: dir
        path: ..
